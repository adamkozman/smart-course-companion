<!DOCTYPE html>
<html lang="english">


<head> 
    <title>Confirm Verification - Concordia Student Portal</title>

    <link rel="stylesheet" href="Styles/Header.css">
    <link rel="stylesheet" href="Styles/LoginPage.css">
    <link rel="stylesheet" href="Styles/Background.css">
</head>


<body>


    <div class="Header">

        <div class="leftside">
          <div class="Title">Smart Course Companion</div>
          
        </div>

        <div class="rightside">
          <input type="checkbox" id="toggle" class="mini-menu">
          <label for="toggle" class="Menu-button">
              <img class="menu-icon" src="Icons/hamburger-menu copy.svg">
              <div class="tooltip">Menu</div> 
          </label>
          <div class="box-to-hide">
            <a href="Login_Front_Page.html"><button class="user-choice1"><div class="option1">Sign In</div></button></a>
            <a href="SignUp_Front_Page.html"><button class="user-choice1"><div class="option2">Sign Up</div></button></a>
          </div>
        </div>
    </div>


        <div class="PageTitle">Verification</div>
        <div class="Login_Box">
            <div class="Request">Enter verification code sent to your email:</div>
            <div class="Form">
   <form action="/verify-email" method="post">
    <div>
        <label for="email">Email:</label>
        <input type="text" id="email" name="email" required>
    </div>
    <div>
        <label for="verificationCode">Verification Code:</label>
        <input type="text" id="verificationCode" name="verificationCode" required>
    </div>
    <div class="button-container">
        <input class="user-choice2" type="submit" value="Submit">
        <input class="user-choice2" type="reset" value="Reset">
    </div>
</form>

<script>
    let pageAddress = window.location.search;
    let info = new URLSearchParams(pageAddress);
    let emailFromPage = info.get("email");

    if (emailFromPage) {
        document.getElementById("email").value = emailFromPage;
    }
</script>
            </div>
        </div>




    <div class="background"></div>

</body>



</html>
